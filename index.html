<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Happy Birthday Zuha 🎉</title>

<style>
body {
    margin: 0;
    overflow: hidden;
    font-family: 'Segoe UI', sans-serif;

    /* DARKER, MORE ROMANTIC BACKGROUND */
    background: radial-gradient(circle at top, #ff2b6a, #5a001f);
    color: white;
}

/* PAGE */
.page {
    position: absolute;
    width: 100%;
    height: 100vh;
    display: none;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    text-align: center;
    padding: 20px;
}

.page.active { display: flex; }

/* TEDDY */
.teddy {
    font-size: 95px;   /* BIGGER */
    animation: float 2.5s ease-in-out infinite;
    margin-bottom: 10px;
}

@keyframes float {
    0%,100% { transform: translateY(0); }
    50% { transform: translateY(-15px); }
}

/* TEXT BOX (LARGER TEXT) */
.box {
    background: rgba(0,0,0,0.65);
    padding: 30px 35px;
    border-radius: 20px;
    max-width: 85%;

    /* 🔥 FIX: BIGGER TEXT */
    font-size: 28px;
    line-height: 1.8;

    backdrop-filter: blur(10px);
}

/* BUTTONS */
.btn {
    padding: 14px 30px;
    margin: 12px;
    font-size: 20px;
    border: none;
    border-radius: 14px;
    cursor: pointer;
    transition: 0.2s;
}

.yes { background: #22c55e; color: white; }
.no { background: #ef4444; color: white; }
.next { background: #3b82f6; color: white; }

.btn:active { transform: scale(0.9); }

/* =========================
   FALLING EFFECTS (FIXED SIZE)
========================= */

.heart, .sparkle {
    position: absolute;
    top: -20px;
    pointer-events: none;
}

/* 🔥 BIGGER HEARTS */
.heart {
    color: #ff0033;
    font-size: 30px;   /* increased */
    text-shadow: 0 0 8px rgba(255,0,80,0.7);
    animation: fall linear infinite;
}

/* 🔥 BIGGER SPARKLES */
.sparkle {
    color: #ffffff;
    font-size: 22px;   /* increased */
    opacity: 0.9;
    text-shadow: 0 0 10px white;
    animation: fall linear infinite;
}

@keyframes fall {
    0% { transform: translateY(-20px) rotate(0deg); opacity: 1; }
    100% { transform: translateY(100vh) rotate(360deg); opacity: 0; }
}

/* CONFETTI */
canvas {
    position: absolute;
    top: 0;
    left: 0;
    pointer-events: none;
}
</style>
</head>

<body>

<canvas id="confetti"></canvas>

<!-- PAGE 1 -->
<div class="page active" id="p1">
    <div class="teddy">🧸</div>
    <div class="box" id="t1"></div>

    <div>
        <button class="btn yes" id="p1yes">Yes</button>
        <button class="btn no" id="p1no">No</button>
    </div>
</div>

<!-- PAGE 2 -->
<div class="page" id="p2">
    <div class="teddy">🧸</div>
    <div class="box" id="t2"></div>

    <div>
        <button class="btn yes" id="p2yes">Yes</button>
        <button class="btn no" id="p2no">No</button>
    </div>
</div>

<!-- PAGE 3 -->
<div class="page" id="p3">
    <div class="teddy">🧸</div>
    <div class="box" id="t3"></div>
    <button class="btn next" id="next">Next →</button>
</div>

<!-- PAGE 4 -->
<div class="page" id="p4">
    <div class="teddy">🧸</div>
    <div class="box" id="t4"></div>
</div>

<script>

/* TYPEWRITER */
function type(id,text,speed=18){
    let i=0;
    function run(){
        if(i<text.length){
            document.getElementById(id).innerHTML+=text.charAt(i);
            i++;
            setTimeout(run,speed);
        }
    }
    run();
}

/* TEXT */
type("t1",
`Happy Birthday, Zuha 🎉
May you have a great day.

Taha wants to tell you something special.
Do you want to see it?`);

type("t2",
`Before moving to the surprise, answer a simple question:

Do you love Taha Iqbal?`);

type("t3",
`Yaahooooooo! 🎉
I knew it!
Love you too, baby 😚💋`);

type("t4",
`Syeda Zuha Zaidi, my first female friend in the whole university.

She is still my best friend.

No one has the right to take her place in my life because she has been loyal to me from day one.

I consider her the most courageous girl I have ever met.

Even though we are busy, our bond is still strong.

I want you to be my friend till my last breath.

Thank you a lot for being my friend. I always thank God that He gave me such a kind, caring, and beautiful friend like you.

Time for the surprise. Go and check my chat ❤️`);

/* NAVIGATION */
function show(id){
    document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
    document.getElementById(id).classList.add("active");
    if(id==="p3") burst();
    if(id==="p4") burst();
}

/* BUTTON LOGIC */
let n1=20,y1=20;
document.getElementById("p1yes").onclick=()=>show("p2");

document.getElementById("p1no").onclick=()=>{
    n1-=2; y1+=3;
    document.getElementById("p1no").style.fontSize=n1+"px";
    document.getElementById("p1yes").style.fontSize=y1+"px";
};

let n2=20,y2=20;
document.getElementById("p2yes").onclick=()=>show("p3");

document.getElementById("p2no").onclick=()=>{
    n2-=2; y2+=3;
    document.getElementById("p2no").style.fontSize=n2+"px";
    document.getElementById("p2yes").style.fontSize=y2+"px";
};

document.getElementById("next").onclick=()=>show("p4");

/* FALLING HEARTS (BIGGER + SLOWER + NICER) */
function create(){
    const e=document.createElement("div");

    const r=Math.random();
    if(r<0.6){
        e.className="heart";
        e.innerHTML="❤";
    } else {
        e.className="sparkle";
        e.innerHTML="✦";
    }

    e.style.left=Math.random()*100+"vw";
    e.style.animationDuration=(4+Math.random()*3)+"s";

    document.body.appendChild(e);
    setTimeout(()=>e.remove(),7000);
}
setInterval(create,150);

/* CONFETTI */
const canvas=document.getElementById("confetti");
const ctx=canvas.getContext("2d");
canvas.width=innerWidth;
canvas.height=innerHeight;

let pieces=[];

function burst(){
    for(let i=0;i<150;i++){
        pieces.push({
            x:canvas.width/2,
            y:canvas.height/2,
            vx:(Math.random()-0.5)*10,
            vy:(Math.random()-0.5)*10,
            a:1
        });
    }
}

function draw(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    pieces.forEach(p=>{
        ctx.fillStyle="rgba(255,255,255,"+p.a+")";
        ctx.fillRect(p.x,p.y,5,5);
        p.x+=p.vx;
        p.y+=p.vy;
        p.a-=0.008;
    });
    pieces=pieces.filter(p=>p.a>0);
    requestAnimationFrame(draw);
}
draw();

</script>

</body>
</html>
